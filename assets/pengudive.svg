<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#bae6fd"/>
      <stop offset="53%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#063954"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="28%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#skyGrad)" />

  <!-- Warm Polar Sun -->
  <circle cx="192" cy="58" r="22" fill="#fef08a" opacity="0.92" />

  <!-- Distant Iceberg Spire -->
  <polygon points="36,136 74,70 108,136" fill="url(#iceGrad)" />
  <polygon points="74,70 92,136 108,136" fill="#7dd3fc" opacity="0.65" />
  <polygon points="42,136 74,186 104,136" fill="#38bdf8" opacity="0.42" />

  <!-- Ocean Wave Ribbon -->
  <path d="M8 134 Q68 120 128 134 T248 134 L248 200 Q248 248 200 248 L56 248 Q8 248 8 200 Z" fill="#0369a1" opacity="0.72" />
  <path d="M12 135 Q70 121 128 135 T244 135" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" opacity="0.85" />

  <!-- Friendly Spotted Seal peeking & blowing bubble ring on right -->
  <g transform="translate(184, 174) rotate(-14)">
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="#94a3b8" />
    <ellipse cx="-4" cy="4" rx="21" ry="11" fill="#e2e8f0" />
    <circle cx="-16" cy="-5" r="3.2" fill="#0f172a" />
    <circle cx="-17" cy="-6" r="1.1" fill="#ffffff" />
    <ellipse cx="-25" cy="-1" rx="3.2" ry="2.2" fill="#1e293b" />
    <circle cx="6" cy="-6" r="2.5" fill="#475569" />
    <circle cx="14" cy="-2" r="2.2" fill="#475569" />
  </g>

  <!-- Shimmering Bubble Ring -->
  <circle cx="150" cy="196" r="13" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.9" />
  <circle cx="136" cy="176" r="4" fill="#cffafe" opacity="0.85" />
  <circle cx="126" cy="164" r="2.8" fill="#cffafe" opacity="0.75" />

  <!-- Diving / Leaping 3D-Styled Penguin Hero -->
  <g transform="translate(114, 126) rotate(28)">
    <!-- Orange Webbed Feet -->
    <rect x="-18" y="46" width="13" height="12" rx="4" fill="#fb923c" />
    <rect x="5" y="46" width="13" height="12" rx="4" fill="#fb923c" />

    <!-- Flippers Spread Wide -->
    <ellipse cx="-38" cy="4" rx="22" ry="9" transform="rotate(-24 -38 4)" fill="#1e293b" />
    <ellipse cx="38" cy="4" rx="22" ry="9" transform="rotate(24 38 4)" fill="#1e293b" />

    <!-- Sleek Torso -->
    <ellipse cx="0" cy="8" rx="31" ry="44" fill="#0f172a" />
    <ellipse cx="0" cy="13" rx="22" ry="35" fill="url(#bellyGrad)" />

    <!-- Penguin Head -->
    <circle cx="0" cy="-32" r="24" fill="#0f172a" />
    <!-- Cute Eyes -->
    <circle cx="-9" cy="-36" r="5.2" fill="#ffffff" />
    <circle cx="9" cy="-36" r="5.2" fill="#ffffff" />
    <circle cx="-8.5" cy="-36" r="3" fill="#0f172a" />
    <circle cx="8.5" cy="-36" r="3" fill="#0f172a" />
    <circle cx="-9.8" cy="-37.5" r="1.2" fill="#ffffff" />
    <circle cx="7.2" cy="-37.5" r="1.2" fill="#ffffff" />
    <!-- Rosy Cheeks -->
    <ellipse cx="-14" cy="-29" rx="3.8" ry="2.2" fill="#fda4af" opacity="0.75" />
    <ellipse cx="14" cy="-29" rx="3.8" ry="2.2" fill="#fda4af" opacity="0.75" />
    <!-- Orange Beak -->
    <polygon points="-7,-29 7,-29 0,-17" fill="#f97316" />
  </g>

  <!-- Subtle glossy border -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="#e0f2fe" stroke-width="3" opacity="0.45" />
</svg>
